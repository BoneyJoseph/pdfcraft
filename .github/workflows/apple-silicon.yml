name: Apple Silicon App (Lean)

on:
  push:
    branches:
      - cleanup/remove-promotional-artcraft-links
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  apple-silicon:
    name: Build GUI-only Apple Silicon DMG
    runs-on: macos-15
    timeout-minutes: 120
    env:
      CARGO_INCREMENTAL: "0"
      PDFCRAFT_BUILD_LABEL: "community"
      MACOS_SIGN_IDENTITY: "-"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          key: community-apple-silicon
      - name: Validate packaging script
        run: bash -n packaging/macos/package.sh
      - name: Verify Rust project
        run: |
          cargo check --locked -p pdfcraft --target aarch64-apple-darwin
      - name: Build PdfCraft for Apple Silicon
        run: |
          bash packaging/macos/package.sh --arch aarch64 --app-only
      - name: Verify bundle architecture and signing
        run: |
          set -euo pipefail
          app="target/macos-package/PdfCraft.app"
          test -d "$app"
          lipo -archs "$app/Contents/MacOS/PdfCraft" | grep -w arm64
          codesign --verify --strict --deep "$app"
          test -f "dist/release/pdfcraft-$(awk '/^\[workspace.package\]/{x=1;next} /^\[/{x=0} x && /^version =/{gsub(/"/,"",$3);print $3;exit}' Cargo.toml)-macos-aarch64.dmg"
      - name: Upload Apple Silicon application
        id: uploaded_lean
        uses: actions/upload-artifact@v4
        with:
          name: PdfCraft-Apple-Silicon-Lean-DMG
          path: |
            dist/release/*macos-aarch64.dmg
          if-no-files-found: error
          retention-days: 30
      # Only remove old installers once this run has produced a verified new DMG.
      # Keep the current plus one previous lean DMG for rollback. Preserve CI and test artifacts.
      - name: Prune obsolete installer artifacts
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          CURRENT_ARTIFACT_ID: ${{ steps.uploaded_lean.outputs.artifact-id }}
        with:
          script: |
            const name = 'PdfCraft-Apple-Silicon-Lean-DMG';
            const oldNames = new Set([name, 'PdfCraft-Apple-Silicon-DMG']);
            const currentId = Number(process.env.CURRENT_ARTIFACT_ID);
            if (!Number.isSafeInteger(currentId) || currentId <= 0) {
              throw new Error('Uploaded lean installer ID was not returned');
            }
            const { owner, repo } = context.repo;
            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, {
              owner, repo, per_page: 100,
            });
            const olderLean = artifacts.filter(a => a.name === name && a.id !== currentId && !a.expired)
              .sort((a, b) => b.id - a.id);
            const keep = new Set([currentId, ...olderLean.slice(0, 1).map(a => a.id)]);
            const old = artifacts.filter(a => oldNames.has(a.name) && !keep.has(a.id));
            for (const a of old) {
              await github.rest.actions.deleteArtifact({ owner, repo, artifact_id: a.id });
              core.info(`Deleted old installer ${a.name} (#${a.id})`);
            }
            core.info(`Kept ${keep.size} lean installer(s); removed ${old.length} obsolete installer artifacts.`);
